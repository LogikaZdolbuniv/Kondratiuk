<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ancient Japan | Бронювання</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">My ancient Japan</div>

    <nav class="nav-menu">
        <a href="index.html">Головна</a>
        <a href="menu.html">Меню</a>
        <a href="booking.html" class="active">Бронювання</a>
    </nav>
</header>

<!-- ===== BOOKING SECTION ===== -->
<section class="booking-wrapper">

    <!-- LEFT IMAGE -->
    <div class="side-image">
        <img src="https://i.pinimg.com/1200x/9a/45/dd/9a45dd2c7e21127ddbc7be32f0b8fb39.jpg" alt="Japan food">
    </div>

    <!-- FORM -->
    <form action="#" method="post" class="booking-form">

        <h2>Бронювання столика</h2>

        <input type="text" placeholder="Ваше ім'я" required>
        <input type="tel" placeholder="Номер телефону" required>
        <input type="date" required>
        <input type="time" required>

        <select required>
            <option disabled selected>Оберіть кількість місць</option>
            <option>2 місця</option>
            <option>4 місця</option>
            <option>6 місць</option>
        </select>

        <textarea placeholder="Коментар..."></textarea>

        <button type="submit">Забронювати</button>

    </form>

    <!-- RIGHT IMAGE -->
    <div class="side-image">
        <img src="https://i.pinimg.com/1200x/2a/be/34/2abe34c9d5b747f8bdc744ced0df1339.jpg" alt="Japan dessert">
    </div>

</section>

<footer>
    <p>My ancient Japan © 2026</p>
</footer>

</body>
</html>
